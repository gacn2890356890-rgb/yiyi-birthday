<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>マシュマロ・ハート · 星屑の内緒話</title>
<style>
  :root{
    --bg1:#070a1f; --bg2:#1a1245; --pink:#ffb7d5; --pink2:#ff8fbf; --cream:#fff4ea; --gold:#ffe29a;
    --glass:rgba(255,255,255,.07); --line:rgba(255,255,255,.16);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{
    background:radial-gradient(ellipse at 50% 120%,#3b2a7a 0,var(--bg2) 38%,var(--bg1) 82%);
    color:var(--cream);
    font-family:"Hiragino Sans","PingFang SC","Noto Sans JP","Yu Gothic","Microsoft YaHei",system-ui,sans-serif;
  }
  button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
  #sky{position:fixed;inset:0;width:100%;height:100%;z-index:0}

  /* ===== 开场 ===== */
  #gate{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:28px;
    background:rgba(7,10,31,.5);backdrop-filter:blur(4px);transition:opacity 1.2s,visibility 1.2s}
  #gate.hide{opacity:0;visibility:hidden;pointer-events:none}
  .moon{font-size:60px;animation:float 4s ease-in-out infinite;filter:drop-shadow(0 0 20px rgba(255,226,154,.6))}
  .tag{letter-spacing:.4em;font-size:12px;color:var(--gold);text-transform:uppercase}
  #gate h1{font-weight:200;letter-spacing:.12em;font-size:clamp(30px,8vw,56px);
    background:linear-gradient(90deg,var(--pink),var(--cream),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 18px rgba(255,183,213,.4))}
  #gate .album{opacity:.7;letter-spacing:.25em;font-size:14px}
  #wish{max-width:480px;line-height:2;opacity:.88;font-size:15px;white-space:pre-line}
  #open{margin-top:6px;padding:14px 38px;border-radius:999px;border:1px solid var(--pink);
    background:linear-gradient(135deg,rgba(255,143,191,.35),rgba(255,226,154,.2));
    letter-spacing:.25em;font-size:16px;box-shadow:0 0 30px rgba(255,143,191,.35);transition:.3s}
  #open:hover{transform:scale(1.05);box-shadow:0 0 45px rgba(255,143,191,.6)}

  /* ===== 主舞台 ===== */
  #app{position:fixed;inset:0;z-index:1;display:flex;flex-direction:column;max-width:760px;margin:0 auto;
    padding:max(14px,env(safe-area-inset-top)) 18px max(14px,env(safe-area-inset-bottom))}
  header{display:flex;align-items:center;gap:14px;padding:6px 4px 14px}
  .disc{flex:none;width:54px;height:54px;border-radius:50%;position:relative;
    background:conic-gradient(from 0deg,#ff8fbf,#ffe29a,#a98bff,#7fd6ff,#ff8fbf);
    box-shadow:0 0 22px rgba(255,143,191,.5);animation:spin 12s linear infinite;animation-play-state:paused}
  .disc.on{animation-play-state:running}
  .disc::after{content:"";position:absolute;inset:36%;border-radius:50%;background:var(--bg1)}
  .meta{flex:1;min-width:0}
  .meta .t{font-size:clamp(18px,5vw,24px);letter-spacing:.08em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .meta .a{font-size:12px;opacity:.6;letter-spacing:.18em;margin-top:2px}
  .modes{display:flex;gap:4px;padding:3px;border-radius:999px;background:var(--glass);border:1px solid var(--line)}
  .modes button{padding:5px 11px;border-radius:999px;font-size:12px;opacity:.65;transition:.2s}
  .modes button.on{background:rgba(255,143,191,.35);opacity:1}

  #lyrics{position:relative;flex:1;overflow-y:auto;scrollbar-width:none;padding:38vh 4px 38vh;scroll-behavior:smooth;
    -webkit-mask-image:linear-gradient(transparent 0,#000 18%,#000 82%,transparent 100%);
            mask-image:linear-gradient(transparent 0,#000 18%,#000 82%,transparent 100%)}
  #lyrics::-webkit-scrollbar{display:none}
  .sec{font-size:11px;letter-spacing:.35em;color:var(--gold);opacity:.55;margin:34px 0 8px;text-transform:uppercase}
  .ln{padding:10px 8px;border-radius:16px;cursor:pointer;opacity:.28;transform:scale(.94);transform-origin:left center;
    transition:opacity .5s,transform .5s,background .5s,filter .5s;filter:blur(.6px)}
  .ln:hover{opacity:.55}
  .ln.near{opacity:.5}
  .ln.act{opacity:1;transform:scale(1);filter:none;background:linear-gradient(90deg,rgba(255,143,191,.14),transparent)}
  .ln .jp{font-size:clamp(20px,5.4vw,30px);line-height:1.5;letter-spacing:.04em;font-weight:500}
  .ln .zh{font-size:clamp(13px,3.7vw,17px);opacity:.75;margin-top:2px;letter-spacing:.06em}
  .ln.act .jp{color:var(--pink);text-shadow:0 0 22px rgba(255,143,191,.7)}
  .ln.act .zh{color:var(--cream);opacity:.95}
  body.m-jp .zh{display:none}
  body.m-zh .jp{display:none}
  body.m-zh .ln .zh{font-size:clamp(20px,5.4vw,28px);opacity:1;margin:0}
  body.m-zh .ln.act .zh{color:var(--pink);text-shadow:0 0 22px rgba(255,143,191,.7)}
  .ln.chorus .jp{font-weight:600}

  footer{padding:12px 4px 4px}
  .bar{position:relative;height:6px;border-radius:6px;background:rgba(255,255,255,.15);cursor:pointer}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pink2),var(--gold));border-radius:6px}
  .bar::before{content:"";position:absolute;inset:-10px 0}
  .time{display:flex;justify-content:space-between;font-size:11px;opacity:.6;margin:7px 0 6px}
  .ctrl{display:flex;justify-content:center;align-items:center;gap:26px}
  .ctrl button{font-size:20px;opacity:.8;width:44px;height:44px;border-radius:50%;transition:.2s}
  .ctrl button:hover{opacity:1;transform:scale(1.1)}
  #play{width:62px;height:62px;border:1px solid var(--pink);background:rgba(255,143,191,.25);font-size:22px;opacity:1}

  /* ===== 结尾卡片 ===== */
  #end{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center;padding:28px;
    background:rgba(7,10,31,.72);backdrop-filter:blur(5px);opacity:0;visibility:hidden;transition:opacity 1.2s,visibility 1.2s}
  #end.show{opacity:1;visibility:visible}
  #endTxt{font-size:clamp(22px,6vw,34px);font-weight:200;letter-spacing:.14em;line-height:1.9;white-space:pre-line}
  #sig{opacity:.7;font-size:14px}
  #again{padding:11px 30px;border-radius:999px;border:1px solid var(--pink);background:rgba(255,143,191,.2);letter-spacing:.2em}

  /* ===== 校准面板（?sync=1） ===== */
  #cal{position:fixed;left:10px;right:10px;bottom:10px;z-index:40;display:none;padding:12px 14px;border-radius:16px;background:rgba(0,0,0,.82);border:1px solid var(--gold);font-size:13px}
  #cal.on{display:block}
  #cal .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  #cal button{padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.1)}
  #cal .stamp{background:var(--pink2);color:#200;font-weight:700;flex:1;min-width:140px;padding:12px}
  #calNext{color:var(--gold);margin-top:4px;font-size:14px}


  .tiny{font-size:12px;opacity:.6;letter-spacing:.1em}
  #gateMascot img,#endMascot img{height:min(32vh,300px);width:auto;filter:drop-shadow(0 0 22px rgba(120,255,240,.55))}
  #mascot{position:fixed;right:max(6px,calc(50% - 390px));bottom:max(6px,env(safe-area-inset-bottom));width:116px;z-index:6;pointer-events:none}
  #mascot img{width:100%;height:auto;display:block;filter:drop-shadow(0 0 14px rgba(120,255,240,.5))}
  #bubble{position:absolute;right:62%;bottom:88%;white-space:nowrap;padding:6px 12px;border-radius:14px 14px 4px 14px;font-size:13px;color:#3a2450;
    background:linear-gradient(135deg,#fff,#ffe6f1);box-shadow:0 4px 18px rgba(255,143,191,.5);opacity:0;transform:scale(.6) translateY(8px);transform-origin:100% 100%;transition:.35s cubic-bezier(.3,1.6,.5,1)}
  #bubble.on{opacity:1;transform:none}
  @media(max-width:520px){#mascot{width:88px}}
  img.mk{transform-origin:50% 100%;animation:mkidle 3s ease-in-out infinite}
  img.mk.sing{animation:mksing .62s ease-in-out infinite}
  @keyframes mkidle{50%{transform:translateY(-4px) rotate(1deg)}}
  @keyframes mksing{50%{transform:translateY(-9px) rotate(-3deg)}}
  .mk .bob{animation:bob 2.4s ease-in-out infinite;transform-origin:100px 230px}
  .mk.sing .bob{animation:bob .62s ease-in-out infinite}
  .mk .tl{transform-origin:46px 70px;animation:swayL 2.2s ease-in-out infinite}
  .mk .tr{transform-origin:154px 70px;animation:swayR 2.2s ease-in-out infinite}
  .mk.sing .tl{animation-duration:.62s}.mk.sing .tr{animation-duration:.62s}
  .mk .eyes{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}
  .mk .mouth-o{opacity:0;transform-box:fill-box;transform-origin:center}
  .mk.sing .mouth-o{opacity:1;animation:talk .34s ease-in-out infinite}
  .mk.sing .mouth-s{opacity:0}
  .mk .arm{transform-origin:138px 168px;animation:wave 1.4s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-7px) rotate(1.2deg)}}
  @keyframes swayL{50%{transform:rotate(6deg)}}@keyframes swayR{50%{transform:rotate(-6deg)}}
  @keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.08)}}
  @keyframes talk{50%{transform:scaleY(.35)}}
  @keyframes wave{50%{transform:rotate(-22deg)}}
  .heart{position:fixed;z-index:35;pointer-events:none;color:var(--pink);animation:rise 3.5s ease-out forwards}
  @keyframes rise{from{opacity:.9;transform:translateY(0) scale(.6)}to{opacity:0;transform:translateY(-180px) scale(1.3)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes float{50%{transform:translateY(-8px)}}
</style>
</head>
<body class="m-both">
<canvas id="sky"></canvas>

<div id="gate">
  <div class="tag">✧ Happy Birthday ✧</div>
  <h1 id="gName"></h1>
  <div class="album" id="gAlbum"></div>
  <div id="wish"></div>
  <div id="gateMascot"></div>
  <button id="open">拆开小星星礼物 ✦</button>
  <div class="tiny">点一下，星星就会为你亮起来哦 ♡</div>
</div>

<div id="app">
  <header>
    <div class="disc" id="disc"></div>
    <div class="meta"><div class="t">マシュマロ・ハート</div><div class="a" id="album"></div></div>
    <div class="modes" id="modes">
      <button data-m="both" class="on">日·中</button><button data-m="jp">日</button><button data-m="zh">中</button>
    </div>
  </header>
  <div id="lyrics"></div>
  <footer>
    <div class="bar" id="bar"><i id="fill"></i></div>
    <div class="time"><span id="cur">0:00</span><span id="dur">0:00</span></div>
    <div class="ctrl">
      <button id="prev" aria-label="上一句">⏮</button>
      <button id="play" aria-label="播放/暂停">▶</button>
      <button id="next" aria-label="下一句">⏭</button>
    </div>
  </footer>
</div>

<div id="end">
  <div id="endMascot"></div>
  <div id="endTxt"></div>
  <div id="sig"></div>
  <button id="again">再听一遍嘛～♡</button>
</div>

<div id="cal">
  <div><b>歌词校准模式</b>：点“开始”后，每听到一句开始唱，就按【打点】或空格键。</div>
  <div id="calNext"></div>
  <div class="row">
    <button id="calSec" style="border-color:var(--gold)">快速：只打段落(推荐)</button>
    <button id="calStart">逐句打点</button>
    <button class="stamp" id="calStamp">打点 ▶ 下一句开始了</button>
    <button id="calUndo">撤销</button>
    <button id="calCopy">复制时间轴</button>
    <button id="calReset">清除已保存</button>
  </div>
</div>

<div id="mascot"><div id="bubble"></div></div>
<audio id="audio" src="song.m4a" preload="auto"></audio>

<script>
/* ================== CONFIG：改这里就行 ================== */
const CONFIG = {
  herName: "依依宝宝",
  albumName: "星屑の内緒話",
  wish: "依依宝宝～生日快乐呀！🎂✨\n今天的你，是全宇宙最闪亮的那颗小星星 ⭐\n愿你的每一天都软软甜甜，像棉花糖一样 ☁️\n也像草莓牛奶一样，咕嘟咕嘟冒着开心的小泡泡 🍓\n这首《マシュマロ・ハート》，是偷偷藏给你的星屑小秘密 (๑>◡<๑)",
  ending: "依依宝宝，生日快乐！！🎉\n今年也要偷偷喜欢你很多很多遍 ♡\n明天见，后天见，每天都想见到你 (⁄ ⁄•⁄ω⁄•⁄ ⁄)",
  signature: "— 爱你爱你的、你的小星星 ⭐",
};

/* 歌词：[段落标题(可空), 日语, 中文, 是否副歌] */
const LINES = [
 ["Intro","♪　♪　♪","",0],
 ["", "Pa pa pa…　ふわふわ","啪啪啪……　软绵绵"],
 ["", "Doo bi doo　しゅわしゅわ","嘟比嘟　咝咝冒着泡"],
 ["", "んー……あっ！","嗯——……啊！"],
 ["", "見つかっちゃった♡","被你发现啦♡"],

 ["Verse 1","いちごミルクの　午後三時","草莓牛奶般的　下午三点"],
 ["", "君の横顔　ちらり、ちらり","你的侧脸　偷偷瞄一眼、又一眼"],
 ["", "目が合ったなら　知らんぷり","若是目光相遇　就假装没看见"],
 ["", "なのにほっぺが　ぽっと赤い","可脸颊却　悄悄泛起了红"],

 ["Pre-Chorus","ねえねえ　どうしよう？","呐呐　怎么办呀？"],
 ["", "ドキドキ　止まらない","心怦怦直跳　停不下来"],
 ["", "一歩近づく　そのたびに","每当向你靠近一步"],
 ["", "心が半音　跳ねちゃうの","心就跳高了半个音"],

 ["Chorus","ぷかぷか　マシュマロ・ハート","轻飘飘　棉花糖之心",1],
 ["", "君の笑顔で　とろけちゃう","被你的笑容　融化了",1],
 ["", "くるくる　恋のメロディー","滴溜溜　恋爱的旋律",1],
 ["", "甘くてちょっぴり　くすぐったい","甜甜的　又有一点痒痒的",1],
 ["", "好き、好き……なんて！","喜欢、喜欢……什么的！",1],
 ["", "まだまだ　言えないけど","现在还说不出口",1],
 ["", "ねえ　もう少しだけ","呐　再多一会儿",1],
 ["", "隣にいてもいい？","可以待在你身边吗？",1],

 ["Instrumental","Doo ba doo　pa pa pa","嘟吧嘟　啪啪啪"],
 ["", "Shu bi du wa　la la la","咻比嘟哇　啦啦啦"],

 ["Verse 2","帰り道には　星ひとつ","回家的路上　有一颗星星"],
 ["", "君と歩幅を　合わせてる","悄悄与你的步伐　保持一致"],
 ["", "「また明日ね」の　その前に","在说出“明天见”之前"],
 ["", "小さな勇気を　ポケットへ","把小小的勇气　放进口袋"],

 ["Bridge","もしもね　もしも……","如果呀　如果……"],
 ["", "手をつないだら？","牵起手的话？"],
 ["", "……だめ、だめ！","……不行、不行！"],
 ["", "想像だけで　熱くなる","光是想象　就已经发烫"],

 ["Final Chorus","ぷかぷか　マシュマロ・ハート","轻飘飘　棉花糖之心",1],
 ["", "君の声だけ　追いかける","只追随着你的声音",1],
 ["", "きらきら　恋のメロディー","闪闪亮　恋爱的旋律",1],
 ["", "昨日より少し　近づいた","比起昨天　又近了一点点",1],
 ["", "好き、好き……やっぱり！","喜欢、喜欢……果然！",1],
 ["", "言葉にできないけど","虽然无法用言语表达",1],
 ["", "ねえ　この気持ち","呐　这份心意",1],
 ["", "いつか届くかな？","总有一天　能传达给你吗？",1],

 ["Outro","Pa pa pa…　ふわふわ","啪啪啪……　软绵绵"],
 ["", "Doo bi doo　しゅわしゅわ","嘟比嘟　咝咝冒着泡"],
 ["", "……また明日ね♡","……明天见哦♡"],
];

/* 每句开始的秒数（与上面 LINES 一一对应，共 42 个）。
   这是估算值！用 index.html?sync=1 打开 → 校准模式，听着歌打点，
   然后点“复制时间轴”，把结果粘贴替换下面这一行即可。 */
const TIMES = [0,1,3.7,6.5,8.8,23.1,26,29.4,31.6,35.2,37.1,39.9,42.6,46.4,48.8,52.2,54.5,57.7,59.9,62.7,65.9,69.4,71.8,79.9,82.9,85.7,88.1,91.8,94.2,96.5,97.7,103,105.3,108.7,111.1,114.3,116.7,119,122.5,125.6,128.5,133.9];
/* ======================================================= */

const $=id=>document.getElementById(id), audio=$("audio");
const params=new URLSearchParams(location.search), SYNC=params.has("sync");
const KEY="marshmallow_times_v1";
let times=TIMES.slice();


$("gName").textContent=CONFIG.herName;
$("gAlbum").textContent="✦ "+CONFIG.albumName+" ✦";
$("album").textContent=CONFIG.albumName;
$("wish").textContent=CONFIG.wish;
$("endTxt").textContent=CONFIG.ending;
$("sig").textContent=CONFIG.signature;

/* 渲染歌词 */
const box=$("lyrics"), els=[];
LINES.forEach(([sec,jp,zh,ch],i)=>{
  if(sec){const s=document.createElement("div");s.className="sec";s.textContent=sec;box.appendChild(s)}
  const d=document.createElement("div");d.className="ln"+(ch?" chorus":"");
  const a=document.createElement("div");a.className="jp";a.textContent=jp;
  const b=document.createElement("div");b.className="zh";b.textContent=zh;
  d.append(a,b);d.onclick=()=>{audio.currentTime=times[i];audio.play();follow=true};
  box.appendChild(d);els.push(d);
});

/* 模式切换 */
$("modes").onclick=e=>{const m=e.target.dataset.m;if(!m)return;
  document.body.className="m-"+m;[...$("modes").children].forEach(b=>b.classList.toggle("on",b===e.target));
  if(cur>=0)center(cur,false)};

/* 播放控制 */
const fmt=s=>isFinite(s)?Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0"):"0:00";
function sync(){const p=!audio.paused;mkAll().forEach(m=>m.classList.toggle("sing",p));$("play").textContent=p?"❚❚":"▶";$("disc").classList.toggle("on",p)}
audio.addEventListener("play",sync);audio.addEventListener("pause",sync);
audio.addEventListener("loadedmetadata",()=>$("dur").textContent=fmt(audio.duration));
$("play").onclick=()=>audio.paused?audio.play():audio.pause();
$("bar").onclick=e=>{const r=e.currentTarget.getBoundingClientRect();audio.currentTime=(e.clientX-r.left)/r.width*audio.duration;follow=true};
$("prev").onclick=()=>{audio.currentTime=times[Math.max(0,cur-1)];follow=true};
$("next").onclick=()=>{audio.currentTime=times[Math.min(LINES.length-1,cur+1)];follow=true};
audio.addEventListener("ended",()=>{$("end").classList.add("show");burst(innerWidth/2,innerHeight/2)});
$("again").onclick=()=>{$("end").classList.remove("show");audio.currentTime=0;audio.play();follow=true};
$("open").onclick=()=>{$("gate").classList.add("hide");audio.play().catch(()=>{});burst(innerWidth/2,innerHeight/2)};
addEventListener("keydown",e=>{if(e.code==="Space"){e.preventDefault();SYNC&&calOn?stamp():$("play").click()}});

const MASCOT=`<img class="mk" src="miku.png" alt="Q版初音" draggable="false">`;
["gateMascot","endMascot","mascot"].forEach(id=>{const el=$(id);if(id==="mascot")el.insertAdjacentHTML("afterbegin",MASCOT);else el.innerHTML=MASCOT});
const mkAll=()=>[...document.querySelectorAll(".mk")];
const PHRASES={"Intro":"嘟嘟嘟～♪","Verse 1":"草莓牛奶🍓","Pre-Chorus":"心跳怦怦！","Chorus":"好き好き♡","Instrumental":"一起摇摆～","Verse 2":"今晚有星星⭐","Bridge":"牵…牵手？！","Final Chorus":"依依生日快乐！！","Outro":"明天见哦♡"};
let bubT;function say(t){const b=$("bubble");b.textContent=t;b.classList.add("on");clearTimeout(bubT);bubT=setTimeout(()=>b.classList.remove("on"),3200)}
var energy=0;
/* 同步歌词 */
let cur=-1, follow=true, userT=0;
function center(i,smooth=true){const el=els[i];if(!el)return;
  const y=el.offsetTop-box.clientHeight/2+el.offsetHeight/2;
  box.style.scrollBehavior=smooth?"smooth":"auto";box.scrollTo({top:y})}
["wheel","touchmove"].forEach(ev=>box.addEventListener(ev,()=>{follow=false;clearTimeout(userT);userT=setTimeout(()=>{follow=true;if(cur>=0)center(cur)},3500)},{passive:true}));
function tick(){
  const t=audio.currentTime;let i=-1;
  for(let k=0;k<times.length;k++){if(t>=times[k]-.05)i=k;else break}
  if(i!==cur){
    els.forEach((e,k)=>{e.classList.toggle("act",k===i);e.classList.toggle("near",Math.abs(k-i)===1)});
    cur=i;if(follow&&i>=0)center(i);energy=(i>=0&&LINES[i][3])?1:0;if(i>=0&&LINES[i][0]&&PHRASES[LINES[i][0]])say(PHRASES[LINES[i][0]]);
  }
  $("cur").textContent=fmt(t);$("fill").style.width=(t/audio.duration*100||0)+"%";
  requestAnimationFrame(tick)
}
requestAnimationFrame(tick);

/* ===== 校准模式 ===== */
let calOn=false, calArr=[], calIdx=0;
if(SYNC){$("cal").classList.add("on")}
function calShow(){$("calNext").textContent=calIdx<LINES.length?`下一句（${calIdx+1}/${LINES.length}）：${LINES[calIdx][1]}`:"✅ 全部打完了！点“复制时间轴”，保存已自动完成。"}
var stamp=function(){if(!calOn||calIdx>=LINES.length)return;
  calArr[calIdx]=calIdx===0?0:+audio.currentTime.toFixed(1);calIdx++;calShow();
  if(calIdx===LINES.length){times=calArr.slice();try{localStorage.setItem(KEY,JSON.stringify(times))}catch(e){}}};
$("calStart").onclick=()=>{calOn=true;calArr=[0];calIdx=1;follow=true;audio.currentTime=0;audio.play();calShow()};
$("calStamp").onclick=stamp;
$("calUndo").onclick=()=>{if(calIdx>1){calIdx--;calArr.length=calIdx;calShow()}};
$("calCopy").onclick=()=>{const s="const TIMES = "+JSON.stringify(times).replace(/,/g,",")+";";
  (navigator.clipboard?navigator.clipboard.writeText(s):Promise.reject()).then(()=>alert("已复制！"),()=>prompt("复制下面这行：",s))};
$("calReset").onclick=()=>{try{localStorage.removeItem(KEY)}catch(e){}times=TIMES.slice();alert("已恢复默认估算时间")};

/* 快速校准：只打 9 个段落开头 + 结尾，句子按字数自动分配 */
const SECS=[];LINES.forEach((l,i)=>{if(i>0&&l[0])SECS.push(i)});SECS.unshift(1); // 1 = Intro 的人声第一句
let secMode=false,secStamps=[];
function secShow(){const n=secStamps.length;
  $("calNext").textContent=n<SECS.length?`下一个段落（${n+1}/${SECS.length+1}）开始：${LINES[SECS[n]][1]}`:n===SECS.length?"最后：歌词唱完（结束）的那一刻按打点":"✅ 完成！可以点“复制时间轴”。"}
function secApply(){const bounds=SECS.concat([LINES.length]);const t=[0];
  for(let k=0;k<SECS.length;k++){const a=bounds[k],b=bounds[k+1],t0=secStamps[k],t1=secStamps[k+1];
    const w=[];for(let i=a;i<b;i++)w.push(Math.max(6,LINES[i][1].replace(/[\s　]/g,"").length));
    const tot=w.reduce((x,y)=>x+y,0);let acc=0;
    for(let i=a;i<b;i++){t[i]=+(t0+(t1-t0)*acc/tot).toFixed(1);acc+=w[i-a]}}
  times=t;try{localStorage.setItem(KEY,JSON.stringify(times))}catch(e){}}
$("calSec").onclick=()=>{secMode=true;calOn=true;secStamps=[];follow=true;audio.currentTime=0;audio.play();secShow()};
const _stamp=stamp;
stamp=function(){ if(secMode){ if(secStamps.length>SECS.length)return; secStamps.push(+audio.currentTime.toFixed(1)); secShow(); if(secStamps.length===SECS.length+1)secApply(); return;} return _stamp()};
$("calStamp").onclick=()=>stamp();
$("calUndo").onclick=()=>{if(secMode){secStamps.pop();secShow()}else if(calIdx>1){calIdx--;calArr.length=calIdx;calShow()}};
$("calStart").addEventListener("click",()=>{secMode=false});

/* 飘爱心 */
function burst(x,y){for(let i=0;i<16;i++){const h=document.createElement("div");h.className="heart";h.textContent=["♡","✦","♥","✧"][i%4];
  h.style.left=x+(Math.random()-.5)*200+"px";h.style.top=y+(Math.random()-.5)*60+"px";h.style.fontSize=12+Math.random()*20+"px";
  h.style.animationDelay=Math.random()*.6+"s";document.body.appendChild(h);setTimeout(()=>h.remove(),4500)}}

/* 星空：星云 + 极光 + 三层星星 + 爱心星座 + 月亮 + 流星 + 漂浮小棉花糖 */
const cv=$("sky"),ctx=cv.getContext("2d");let W,H,dpr=Math.min(devicePixelRatio||1,2);
let stars=[],shoot=[],floaters=[],trail=[],cons=[],nebs=[];
const rnd=(a,b)=>a+Math.random()*(b-a);
function mkHeart(cx,cy,sc){const p=[];for(let k=0;k<10;k++){const t=k/10*Math.PI*2;p.push([cx+sc*16*Math.pow(Math.sin(t),3),cy-sc*(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))])}return p}
function resize(){W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  const n=Math.floor(W*H/2200);
  stars=Array.from({length:n},()=>{const z=Math.random();return{x:Math.random()*W,y:Math.random()*H,z,r:.3+z*1.5,t:rnd(0,6.28),s:rnd(.5,2),
    c:["255,255,255","255,255,255","255,205,228","255,238,175","190,225,255"][Math.floor(Math.random()*5)]}});
  floaters=Array.from({length:Math.floor(W/45)},()=>newFloater(true));
  const sc=Math.min(W,H)/520;
  cons=[{pts:mkHeart(W*.78,H*.2,Math.max(.9,sc*1.5)),label:"♡ 依依座",heart:true},
        {pts:[[.12,.62],[.2,.55],[.3,.6],[.36,.5],[.46,.55]].map(([x,y])=>[x*W,y*H]),label:""},
        {pts:[[.6,.78],[.68,.7],[.76,.76],[.84,.68]].map(([x,y])=>[x*W,y*H]),label:""}];
  nebs=[["255,120,190",.2,.3,.45],["120,100,255",.75,.25,.5],["60,210,220",.5,.8,.45],["255,170,120",.15,.85,.35]].map(([c,x,y,r],i)=>({c,x:x*W,y:y*H,r:r*Math.max(W,H),p:i*1.7}))}
function newFloater(init){return{x:rnd(0,W),y:init?rnd(0,H):H+20,v:rnd(.15,.5),sz:rnd(10,22),ch:["♡","✦","☁","✧","♥","⭐"][Math.floor(Math.random()*6)],ph:rnd(0,6.28),a:rnd(.15,.45)}}
addEventListener("resize",resize);resize();
let mx=0,my=0;
addEventListener("pointermove",e=>{mx=e.clientX/W-.5;my=e.clientY/H-.5;if(Math.random()<.5)trail.push({x:e.clientX,y:e.clientY,l:1,vx:rnd(-.6,.6),vy:rnd(.2,1),c:Math.random()<.5?"255,183,213":"255,226,154"})});
function spark(x,y,r,a,c){ctx.fillStyle=`rgba(${c},${a})`;ctx.beginPath();ctx.arc(x,y,r,0,6.283);ctx.fill();
  if(r>1.1){ctx.strokeStyle=`rgba(${c},${a*.55})`;ctx.lineWidth=.7;ctx.beginPath();ctx.moveTo(x-r*3.5,y);ctx.lineTo(x+r*3.5,y);ctx.moveTo(x,y-r*3.5);ctx.lineTo(x,y+r*3.5);ctx.stroke()}}
function frame(t){
  const ts=t/1000;ctx.clearRect(0,0,W,H);
  // 星云
  ctx.globalCompositeOperation="lighter";
  for(const n of nebs){const x=n.x+Math.sin(ts*.05+n.p)*60,y=n.y+Math.cos(ts*.04+n.p)*40;
    const g=ctx.createRadialGradient(x,y,0,x,y,n.r);g.addColorStop(0,`rgba(${n.c},${.1+.05*energy})`);g.addColorStop(1,`rgba(${n.c},0)`);ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
  // 极光
  for(let k=0;k<3;k++){ctx.beginPath();ctx.moveTo(0,0);
    for(let x=0;x<=W;x+=24){const y=H*(.1+k*.045)+Math.sin(x/170+ts*.4+k*1.3)*H*.05+Math.sin(x/70+ts*.7+k)*H*.015;ctx.lineTo(x,y)}
    ctx.lineTo(W,0);ctx.closePath();const g=ctx.createLinearGradient(0,0,0,H*.35);
    const col=["90,255,210","190,120,255","255,150,210"][k];g.addColorStop(0,`rgba(${col},0)`);g.addColorStop(.7,`rgba(${col},${.05+.04*energy})`);g.addColorStop(1,`rgba(${col},0)`);ctx.fillStyle=g;ctx.fill()}
  ctx.globalCompositeOperation="source-over";
  // 银河带
  const g=ctx.createLinearGradient(0,H*.1,W,H*.7);g.addColorStop(0,"rgba(120,90,255,0)");g.addColorStop(.5,"rgba(255,170,225,.09)");g.addColorStop(1,"rgba(120,200,255,0)");
  ctx.fillStyle=g;ctx.save();ctx.translate(W/2,H/2);ctx.rotate(-.5);ctx.fillRect(-W,-H*.13,W*2,H*.26);ctx.restore();
  // 星星（三层视差）
  const drift=ts*2;
  for(const s of stars){
    const a=(.3+.7*Math.abs(Math.sin(ts*s.s+s.t)))*(.6+.4*energy+.0);
    spark(s.x+mx*s.z*26,((s.y+drift*s.z)%H)+my*s.z*26,s.r,Math.min(1,a),s.c)}
  // 星座
  for(const c of cons){
    ctx.strokeStyle=`rgba(255,200,230,${(c.heart?.35:.2)+.15*Math.sin(ts*1.3)})`;ctx.lineWidth=1;ctx.beginPath();
    c.pts.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));if(c.heart)ctx.closePath();ctx.stroke();
    c.pts.forEach(([x,y],i)=>spark(x,y,2.2,.7+.3*Math.sin(ts*2+i),c.heart?"255,190,225":"255,240,200"));
    if(c.label){ctx.fillStyle="rgba(255,200,230,.7)";ctx.font="12px sans-serif";ctx.textAlign="center";ctx.fillText(c.label,c.pts[0][0],c.pts[0][1]+Math.min(W,H)*.22*0+68)}}
  // 月亮
  const mxp=W<520?W*.16:W*.1,myp=H*.13,mr=W<520?24:34;
  const mg=ctx.createRadialGradient(mxp,myp,mr*.5,mxp,myp,mr*4);mg.addColorStop(0,"rgba(255,235,170,.28)");mg.addColorStop(1,"rgba(255,235,170,0)");ctx.fillStyle=mg;ctx.fillRect(mxp-mr*4,myp-mr*4,mr*8,mr*8);
  ctx.fillStyle="#ffeeb8";ctx.beginPath();ctx.arc(mxp,myp,mr,Math.PI*.5,Math.PI*1.5,false);ctx.arc(mxp+mr*.42,myp,mr*.86,Math.PI*1.5,Math.PI*.5,true);ctx.closePath();ctx.fill();
  // 漂浮的小棉花糖/爱心
  ctx.textAlign="center";
  for(const f of floaters){f.y-=f.v*(1+energy*1.2);f.x+=Math.sin(ts+f.ph)*.3;if(f.y<-30)Object.assign(f,newFloater(false));
    ctx.font=f.sz+"px sans-serif";ctx.fillStyle=`rgba(255,200,225,${f.a*(1+energy*.6)})`;ctx.fillText(f.ch,f.x,f.y)}
  // 流星
  if(Math.random()<.01+.03*energy)shoot.push({x:rnd(0,W),y:rnd(0,H*.5),vx:rnd(6,11),vy:rnd(3,6),l:1});
  for(const m of shoot){m.x+=m.vx;m.y+=m.vy;m.l-=.016;
    const gr=ctx.createLinearGradient(m.x,m.y,m.x-m.vx*12,m.y-m.vy*12);gr.addColorStop(0,`rgba(255,245,225,${m.l})`);gr.addColorStop(1,"rgba(255,200,230,0)");
    ctx.strokeStyle=gr;ctx.lineWidth=2.2;ctx.beginPath();ctx.moveTo(m.x,m.y);ctx.lineTo(m.x-m.vx*12,m.y-m.vy*12);ctx.stroke();spark(m.x,m.y,1.6,m.l,"255,245,225")}
  shoot=shoot.filter(m=>m.l>0&&m.x<W+50);
  // 指尖星屑
  for(const p of trail){p.x+=p.vx;p.y+=p.vy;p.l-=.025;spark(p.x,p.y,1+p.l*1.6,p.l,p.c)}
  trail=trail.filter(p=>p.l>0);
  requestAnimationFrame(frame)
}
requestAnimationFrame(frame);
</script>
</body>
